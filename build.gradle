plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Aqui se añadiran mas adelante los repos Maven de mods de los que dependamos
	// de verdad (Nexus Characters, LevelZ...). De momento no hace falta ninguno.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API: no es obligatoria para un mod vacio, pero el siguiente paso
	// (enganchar eventos de Fabric como ServerPlayConnectionEvents) la necesita,
	// asi que la dejamos declarada desde ya.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

afterEvaluate {
    tasks.named('downloadAssets') {
        downloadThreads = 2
    }
}