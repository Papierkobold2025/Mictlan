# ── Fabric toolchain ──────────────────────────────────────────────────────
# Verifica si hay versiones mas recientes en https://fabricmc.net/develop
# antes de compilar en serio — el ecosistema Fabric se actualiza a menudo,
# incluso para una version de Minecraft tan longeva como 1.20.1.
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.9
loader_version=0.15.7
fabric_api_version=0.92.0+1.20.1

# ── Identidad del mod ────────────────────────────────────────────────────
# Placeholders deliberados. Cambialos por el nombre real del proyecto/mod
# antes de compartir el jar con nadie mas — modid y maven_group son
# especialmente incomodos de renombrar mas adelante (tocan fabric.mod.json,
# el package Java y cualquier referencia cruzada de otros mods a este).
mod_version=0.1.0-SNAPSHOT
maven_group=dev.dario.mictlan
archives_base_name=mictlan